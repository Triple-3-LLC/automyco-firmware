# Camera board (esphome/camera.yaml): its own API key
camera_api_encryption_key: "generate with: python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())'"
frame_upload_url: "https://<id>.lambda-url.us-east-1.on.aws"   # written by cloud/frame-ingest/deploy.sh
